name = "henry-search-api"
main = "search-api-entry.js"
compatibility_date = "2026-10-19"

# Cloudflare-native approximate limits, scoped to each edge location.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "760001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "API_EXTRACT_RATE_LIMITER"
namespace_id = "760002"

  [ratelimits.simple]
  limit = 12
  period = 60

# Cache only the reusable search entrypoint. The default gateway must run
# for every request so it can enforce rate limits and rebuild CORS headers.
[cache]
enabled = true

[exports.default]
type = "worker"

  [exports.default.cache]
  enabled = false

[exports.CachedSearch]
type = "worker"

  [exports.CachedSearch.cache]
  enabled = true

[observability]
enabled = true
head_sampling_rate = 0.1
redact_query_string = true

  [observability.logs]
  enabled = true
  invocation_logs = true
  head_sampling_rate = 0.1
  persist = true
  destinations = ["cloudflare"]

  [observability.issues]
  enabled = true
