name: Web search production smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-search-live-smoke.yml"
      - "backend/search-worker.js"
      - "backend/search-providers.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://henry-search-api.henrymeraldcompany.workers.dev
    steps:
      - name: Verify live web search response
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          headers="$(mktemp)"
          trap 'rm -f "$body" "$headers"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 35 --dump-header "$headers" --output "$body" --write-out '%{http_code}' --get --data-urlencode 'q=Albert Einstein' "$API/search")"
          [[ "$status" == "200" ]] || { echo "Web search returned HTTP $status"; cat "$body"; exit 1; }
          grep -Fqi "X-GOZIE-RateLimit: active" "$headers"
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.query !== "Albert Einstein") throw new Error("Search query was not preserved");
          if (!Array.isArray(data.providers) || data.providers.length < 1) throw new Error("No search provider succeeded");
          if (!Array.isArray(data.failedProviders)) throw new Error("Provider failure details missing");
          if (!Array.isArray(data.results) || data.results.length < 1) throw new Error("Live web search returned no results");
          if (!Number.isSafeInteger(data.totalResults) || data.totalResults < data.results.length) throw new Error("Invalid totalResults count");
          for (const item of data.results) {
            if (typeof item.title !== "string" || !item.title.trim()) throw new Error("A result has no title");
            let url;
            try { url = new URL(item.url); } catch { throw new Error("A result has an invalid URL"); }
            if (url.protocol !== "https:") throw new Error("A result URL is not HTTPS");
          }
          console.log("Live web search passed:", data.results.length, "results from", data.providers.join(", "));
          if (data.failedProviders.length) console.log("Isolated provider failures:", data.failedProviders.length);
          NODE
      - name: Verify live world-news feed includes publisher images
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 45 --output "$body" --write-out '%{http_code}' --get --data-urlencode 'q=world' "$API/news")"
          [[ "$status" == "200" ]] || { echo "World-news feed returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.query !== "world") throw new Error("World-news query was not preserved");
          if (!Array.isArray(data.results) || data.results.length < 1) throw new Error("World-news feed returned no articles");
          const validArticle = data.results.filter(item => typeof item.title === "string" && item.title.trim() && typeof item.url === "string" && /^https:\/\//i.test(item.url));
          if (!validArticle.length) throw new Error("World-news feed returned no valid publisher links");
          const withImages = validArticle.filter(item => typeof item.imageUrl === "string" && /^https:\/\//i.test(item.imageUrl));
          if (!withImages.length) throw new Error("World-news feed returned no publisher image URLs");
          console.log("World-news feed passed:", validArticle.length, "articles;", withImages.length, "with publisher images.");
          NODE
      - name: Verify web search input validation
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$API/search")"
          [[ "$status" == "400" ]] || { echo "Empty-query validation returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof data.error !== "string" || !data.error) throw new Error("Empty-query error contract failed");
          console.log("Web search input validation passed");
          NODE
