name: Webpage reading regression and production safety test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/webpage-reading-live-smoke.yml"
      - "backend/search-worker.js"
      - "backend/search-extract.js"
      - "backend/search-worker.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webpage-reading:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API: https://henry-search-api.henrymeraldcompany.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test successful webpage retrieval and extraction with controlled fixtures
        run: node --test backend/search-worker.test.mjs

      - name: Verify production reader rejects private network targets
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' --get --data-urlencode 'url=http://127.0.0.1/' "$API/extract")"
          [[ "$status" == "400" ]] || { echo "Private-address validation returned HTTP $status; expected 400"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof data.error !== "string" || !data.error) throw new Error("Private-address rejection message is missing");
          console.log("Production private-address rejection passed");
          NODE
