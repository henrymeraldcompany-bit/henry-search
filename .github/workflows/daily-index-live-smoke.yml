name: Daily indexing production smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-index-live-smoke.yml"
      - "backend/worker.js"
      - "backend/daily-search-discovery.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEDIA: https://gozie-search-media.henrymeraldcompany.workers.dev
    steps:
      - name: Verify latest scheduled indexing run and D1 counts
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 25 --output "$body" --write-out '%{http_code}' "$MEDIA/index/status")"
          [[ "$status" == "200" ]] || { echo "Index status returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(data.searchCounts) || !Array.isArray(data.searchFreshness)) throw new Error("Search index status arrays are missing");
          const web = data.searchCounts.find(row => row.kind === "web");
          const news = data.searchCounts.find(row => row.kind === "news");
          if (!web || web.total < 1 || !news || news.total < 1) throw new Error("Daily web/news index rows are missing");
          if (!data.latestRun || !Number.isFinite(Date.parse(data.latestRun.finished_at))) throw new Error("Latest scheduled index run is missing or invalid");
          if (!data.latestRun.stats || data.latestRun.stats.databaseSaveFailures !== 0) throw new Error("Index database save failures were recorded");
          if (!Number.isSafeInteger(data.latestRun.rows_processed) || data.latestRun.rows_processed < 1) throw new Error("Latest run processed no rows");
          const budget = data.latestRun.stats.resourceBudget;
          if (!budget || budget.searchRowsSaved < 1 || budget.searchRowsSaved > budget.searchRowsLimit ||
              budget.webNewsRequests.used > budget.webNewsRequests.limit) {
            throw new Error("Daily web/news resource budget contract failed");
          }
          console.log("Daily index status passed:", web.total, "web rows,", news.total, "news rows; latest run processed", data.latestRun.rows_processed, "rows");
          console.log("Latest run provider failures:", data.latestRun.failure_count);
          NODE

      - name: Verify indexed webpage search returns saved records
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 25 --output "$body" --write-out '%{http_code}' --get --data-urlencode 'kind=web' --data-urlencode 'q=education' "$MEDIA/index/search")"
          [[ "$status" == "200" ]] || { echo "Indexed webpage search returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.kind !== "web" || data.query !== "education" || !Array.isArray(data.results) || data.count !== data.results.length || data.count < 1) {
            throw new Error("Indexed webpage search did not return matching records");
          }
          if (data.results.some(row => !row.title || !row.url)) throw new Error("Indexed webpage result is missing its title or URL");
          console.log("Indexed webpage search passed:", data.count, "records");
          NODE

      - name: Verify indexed news search returns saved records
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 25 --output "$body" --write-out '%{http_code}' --get --data-urlencode 'kind=news' --data-urlencode 'q=education' "$MEDIA/index/search")"
          [[ "$status" == "200" ]] || { echo "Indexed news search returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.kind !== "news" || data.query !== "education" || !Array.isArray(data.results) || data.count !== data.results.length || data.count < 1) {
            throw new Error("Indexed news search did not return matching records");
          }
          if (data.results.some(row => !row.title || !row.url)) throw new Error("Indexed news result is missing its title or URL");
          for (const row of data.results) {
            const url = new URL(row.url);
            if (url.hostname.toLowerCase().replace(/^www\\./, "") === "bing.com" &&
                url.pathname.toLowerCase() === "/news/apiclick.aspx") {
              throw new Error("Legacy Bing tracking redirect leaked from indexed news");
            }
          }
          console.log("Indexed news search passed:", data.count, "records; publisher links normalized");
          NODE
