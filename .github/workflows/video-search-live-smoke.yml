name: Video search production smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/video-search-live-smoke.yml"
      - "backend/worker.js"
      - "backend/video-search.js"
      - "backend/video-filters.js"
      - "backend/youtube-search.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEDIA: https://gozie-search-media.henrymeraldcompany.workers.dev
    steps:
      - name: Verify live safe video search response
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 2 --retry-delay 2 --max-time 45 --output "$body" --write-out '%{http_code}' --get --data-urlencode 'q=space exploration' "$MEDIA/videos")"
          [[ "$status" == "200" ]] || { echo "Video search returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (data.query !== "space exploration") throw new Error("Video search query was not preserved");
          if (data.safeSearch !== true) throw new Error("Video response did not confirm safe-search filtering");
          if (!Array.isArray(data.providers) || data.providers.length < 1) throw new Error("No video provider succeeded");
          if (!Array.isArray(data.failedProviders)) throw new Error("Provider failure details missing");
          if (!Array.isArray(data.results) || data.results.length < 1) throw new Error("Live video search returned no results");
          if (data.count !== data.results.length) throw new Error("Video result count does not match results array");
          for (const item of data.results) {
            if (item.kind !== "video") throw new Error("A result is not classified as a video");
            if (typeof item.title !== "string" || !item.title.trim()) throw new Error("A video result has no title");
            for (const field of ["url", "thumbnailUrl"]) {
              let url;
              try { url = new URL(item[field]); } catch { throw new Error("Video result has invalid " + field + " URL"); }
              if (url.protocol !== "https:") throw new Error("Video result " + field + " URL is not HTTPS");
            }
            if (typeof item.source !== "string" || !item.source) throw new Error("Video source attribution is missing");
          }
          console.log("Live safe video search passed:", data.count, "results from", data.providers.join(", "));
          if (data.failedProviders.length) console.log("Isolated provider failures:", data.failedProviders.length);
          NODE
      - name: Verify video search input validation
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --max-time 20 --output "$body" --write-out '%{http_code}' "$MEDIA/videos")"
          [[ "$status" == "400" ]] || { echo "Empty video query returned HTTP $status"; cat "$body"; exit 1; }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof data.error !== "string" || !data.error || !Array.isArray(data.results)) {
            throw new Error("Video search validation error contract failed");
          }
          console.log("Video search input validation passed");
          NODE
