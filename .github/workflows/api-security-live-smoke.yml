name: API security live smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/api-security-live-smoke.yml"
      - "backend/search-worker.js"
      - "backend/search-api-entry.js"
      - "backend/search-api.wrangler.toml"
      - "backend/README.md"
      - "backend/api-security.js"
      - "backend/api-validation.js"
      - "backend/search-extract.js"
      - "backend/api-rate-limit.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API: https://henry-search-api.henrymeraldcompany.workers.dev
      ALLOWED_ORIGIN: https://henrymeraldcompany-bit.github.io
    steps:
      - name: Verify production CORS and security headers
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          body="$(mktemp)"
          trap 'rm -f "$headers" "$body"' EXIT
          status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' --max-time 15 --header "Origin: $ALLOWED_ORIGIN" "$API/")"
          [[ "$status" == "200" ]] || { echo "API root returned HTTP $status"; cat "$body"; exit 1; }
          grep -Fqi "Access-Control-Allow-Origin: $ALLOWED_ORIGIN" "$headers"
          grep -Fqi "X-Content-Type-Options: nosniff" "$headers"
          grep -Fqi "X-Frame-Options: DENY" "$headers"
          grep -Fqi "Referrer-Policy: no-referrer" "$headers"
          grep -Fqi "Strict-Transport-Security:" "$headers"
          grep -Fqi "X-GOZIE-RateLimit: active" "$headers"
          echo "Production origin, security headers and active rate-limit bindings: ok"


      - name: Verify production endpoint response-time budgets
        shell: bash
        run: |
          set -euo pipefail
          check_fast_endpoint() {
            local label="$1"
            local url="$2"
            local limit="$3"
            local metrics status elapsed
            metrics="$(curl --silent --show-error --output /dev/null --write-out '%{http_code} %{time_total}' --max-time 10 "$url")"
            status="${metrics%% *}"
            elapsed="${metrics##* }"
            [[ "$status" == "200" ]] || { echo "$label returned HTTP $status"; exit 1; }
            awk -v elapsed="$elapsed" -v limit="$limit" 'BEGIN { if ((elapsed + 0) > limit) exit 1 }' || {
              echo "$label took ${elapsed}s; limit is ${limit}s"
              exit 1
            }
            echo "$label response time: ${elapsed}s (limit ${limit}s)"
          }
          check_fast_endpoint "API gateway" "$API/" 3
          check_fast_endpoint "Media health" "https://gozie-search-media.henrymeraldcompany.workers.dev/health" 3

          query="performance verification ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          metrics="$(curl --silent --show-error --output "$body" --write-out '%{http_code} %{time_total}' --max-time 20 --get --data-urlencode "q=$query" "$API/search")"
          status="${metrics%% *}"
          elapsed="${metrics##* }"
          [[ "$status" == "200" ]] || { echo "Live search performance probe returned HTTP $status"; cat "$body"; exit 1; }
          awk -v elapsed="$elapsed" 'BEGIN { if ((elapsed + 0) > 15) exit 1 }' || {
            echo "Live search took ${elapsed}s; limit is 15s"
            cat "$body"
            exit 1
          }
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(data.results) || !Array.isArray(data.providers)) {
            throw new Error("Live search performance response contract failed");
          }
          NODE
          echo "Live web search response time: ${elapsed}s (limit 15s)"

      - name: Reject untrusted browser origins
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl --silent --show-error --dump-header "$headers" --output /dev/null --write-out '%{http_code}' --max-time 15 --request OPTIONS --header 'Origin: https://untrusted.example' --header 'Access-Control-Request-Method: GET' "$API/search")"
          [[ "$status" == "403" ]] || { echo "Untrusted CORS preflight returned HTTP $status; expected 403"; cat "$headers"; exit 1; }
          if grep -Fqi "Access-Control-Allow-Origin:" "$headers"; then
            echo "Untrusted origin received an allow-origin header"
            exit 1
          fi
          echo "Untrusted origin rejected: ok"

      - name: Verify malformed API requests return HTTP 400
        shell: bash
        run: |
          set -euo pipefail
          for path in             '/search'             '/search?q=solar&unexpected=1'             '/search?q=one&q=two'             '/search?q=solar%00energy'             '/search?q=solar&domain=bad_domain'             '/news?q=technology&from=2026-02-30'             '/news?q=technology&from=2026-11-03&to=2026-11-02'             '/extract?url=javascript%3Aalert%281%29' \
            '/extract?url=http%3A%2F%2Flocalhost.%2F' \
            '/extract?url=http%3A%2F%2Fmetadata.google.internal.%2F' \
            '/extract?url=http%3A%2F%2F169.254.169.254.nip.io%2F' \
            '/extract?url=https%3A%2F%2Fhenry-search-api.henrymeraldcompany.workers.dev%2Fhealth'; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 15 "$API$path")"
            if [[ "$status" != "400" ]]; then
              echo "$path returned HTTP $status; expected 400"
              cat "$tmp"
              rm -f "$tmp"
              exit 1
            fi
            node - "$tmp" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (typeof data.error !== "string" || !data.error.trim()) throw new Error("Validation response omitted its error message");
          NODE
            rm -f "$tmp"
          done
          echo "Malformed request validation: ok"

      - name: Verify Workers Cache hit while gateway security still runs
        shell: bash
        run: |
          set -euo pipefail
          query="technology cache verification ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for expected in MISS HIT; do
            headers="$(mktemp)"
            body="$(mktemp)"
            trap 'rm -f "$headers" "$body"' EXIT
            if [[ "$expected" == "MISS" ]]; then
              status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' --max-time 20 --header "Origin: $ALLOWED_ORIGIN" --get --data-urlencode "q=$query" "$API/search")"
            else
              status="$(curl --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}' --max-time 20 --get --data-urlencode "q=$query" "$API/search")"
            fi
            [[ "$status" == "200" ]] || { echo "Cache probe returned HTTP $status on expected $expected"; cat "$body"; exit 1; }
            cache_status="$(awk 'BEGIN { IGNORECASE=1 } $1 == "Cf-Cache-Status:" { gsub("\\r", "", $2); print toupper($2) }' "$headers" | tail -n1)"
            gozie_cache="$(awk 'BEGIN { IGNORECASE=1 } $1 == "X-GOZIE-Cache:" { gsub("\\r", "", $2); print toupper($2) }' "$headers" | tail -n1)"
            rate_limit="$(awk 'BEGIN { IGNORECASE=1 } $1 == "X-GOZIE-RateLimit:" { gsub("\\r", "", $2); print tolower($2) }' "$headers" | tail -n1)"
            [[ "$cache_status" == "$expected" ]] || { echo "Cf-Cache-Status was '$cache_status'; expected '$expected'"; cat "$headers"; exit 1; }
            [[ "$gozie_cache" == "$expected" ]] || { echo "X-GOZIE-Cache was '$gozie_cache'; expected '$expected'"; cat "$headers"; exit 1; }
            [[ "$rate_limit" == "active" ]] || { echo "Rate limiting was not active on $expected"; cat "$headers"; exit 1; }
            if [[ "$expected" == "MISS" ]]; then
              grep -Fqi "Access-Control-Allow-Origin: $ALLOWED_ORIGIN" "$headers"
            else
              if grep -Fqi "Access-Control-Allow-Origin:" "$headers"; then
                echo "Cached response leaked a previous caller's CORS origin"
                cat "$headers"
                exit 1
              fi
            fi
            node - "$body" <<'NODE'
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(data.results)) throw new Error("Cache probe response omitted results array");
          NODE
            rm -f "$headers" "$body"
            trap - EXIT
          done
          echo "Workers Cache MISS/HIT, fresh CORS, and per-request rate limiting: ok"
