name: Media Worker live smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/media-live-smoke.yml"
      - "backend/worker.js"
      - "backend/wrangler.toml"
  workflow_dispatch:
  schedule:
    # Run after the daily D1 refresh (07:00 UTC / 08:00 Africa/Lagos).
    - cron: "30 7 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEDIA_API: https://gozie-search-media.henrymeraldcompany.workers.dev
      SEARCH_API: https://henry-search-api.henrymeraldcompany.workers.dev
    steps:
      - name: Check Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 15 "$MEDIA_API/health" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.status!=="ok")throw new Error("Health route did not report ok");console.log("Health route: ok")})'

      - name: Check index status contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 15 "$MEDIA_API/index/status" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);if(!Array.isArray(d.counts)||!("latestRun" in d))throw new Error("Index status response is missing expected fields");console.log("Index status contract: ok")})'

      - name: Check image and video search routes
        shell: bash
        run: |
          set -euo pipefail
          for kind in images videos; do
            response="$(curl --fail --silent --show-error --retry 1 --retry-delay 2 --max-time 45 --get --data-urlencode "q=solar system" "$MEDIA_API/$kind")"
            printf '%s' "$response" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);const kind=process.argv[1];if(typeof d.query!=="string"||!Array.isArray(d.results)||d.count!==d.results.length)throw new Error("Search response contract failed");const safe=v=>{try{return ["http:","https:"].includes(new URL(v).protocol)}catch{return false}};for(const item of d.results){if(!item||typeof item.title!=="string"||!item.title.trim())throw new Error("Media result is missing a title");const urls=kind==="images"?[item.page,item.image,item.thumbnail]:[item.url];if(urls.some(v=>!safe(v)))throw new Error("Media result has an invalid source URL")}const hosts=new Set(d.results.map(item=>{try{return new URL(kind==="images"?item.page:item.url).hostname}catch{return ""}}).filter(Boolean));console.log("Search route: "+kind+"; "+d.count+" results across "+hosts.size+" source hosts")})' "$kind"
          done
      - name: Check original web-search and news routes
        shell: bash
        run: |
          set -euo pipefail
          for route in search news; do
            response="$(curl --fail --silent --show-error --retry 1 --retry-delay 2 --max-time 45 --get --data-urlencode "q=technology" "$SEARCH_API/$route")"
            printf '%s' "$response" |
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);const route=process.argv[1];if(typeof d.query!=="string"||!Array.isArray(d.results))throw new Error("Legacy route response contract failed");for(const item of d.results){if(!item||typeof item.title!=="string"||!item.title.trim())throw new Error("Legacy result is missing a title");if(typeof item.url!=="string"||!/^https?:\/\//i.test(item.url))throw new Error("Legacy result has an invalid source URL")}console.log("Legacy route: "+route+"; "+d.results.length+" results; source "+(d.source||"unknown"))})' "$route"
          done
