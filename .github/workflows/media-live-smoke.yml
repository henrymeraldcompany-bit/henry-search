name: Media Worker live smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/media-live-smoke.yml"
      - "app.js"
      - "index.html"
      - "style.css"
      - "backend/worker.js"
      - "backend/wrangler.toml"
      - "backend/browser-playback-smoke.mjs"
  workflow_dispatch:
  schedule:
    # Run after the daily D1 refresh (07:00 UTC / 08:00 Africa/Lagos).
    - cron: "30 7 * * *"

permissions:
  contents: read

jobs:
  media:
    name: Media Worker health, index, image and video routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MEDIA_API: https://gozie-search-media.henrymeraldcompany.workers.dev
    steps:
      - name: Check Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 15 "$MEDIA_API/health" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.status!=="ok")throw new Error("Health route did not report ok");console.log("Health route: ok")})'

      - name: Check index status contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 15 "$MEDIA_API/index/status" |
            node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);if(!Array.isArray(d.counts)||!("latestRun" in d))throw new Error("Index status response is missing expected fields");console.log("Index status contract: ok")})'

      - name: Check image and video search routes
        shell: bash
        run: |
          set -euo pipefail
          for kind in images videos; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' --retry 1 --retry-delay 2 --max-time 45 --get --data-urlencode "q=solar system" "$MEDIA_API/$kind")"
            if [[ "$status" != "200" ]]; then
              echo "Media route $kind returned HTTP $status"
              cat "$tmp"
              rm -f "$tmp"
              exit 1
            fi
            node - "$kind" "$tmp" <<'NODE'
          const fs = require("node:fs");
          const kind = process.argv[2];
          const d = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          if (typeof d.query !== "string" || !Array.isArray(d.results) || d.count !== d.results.length) {
            throw new Error("Search response contract failed for " + kind);
          }
          const safe = value => {
            try { return ["http:", "https:"].includes(new URL(value).protocol); }
            catch { return false; }
          };
          const hosts = new Set();
          for (const item of d.results) {
            if (!item || typeof item.title !== "string" || !item.title.trim()) {
              throw new Error("Media result is missing a title");
            }
            const required = kind === "images"
              ? [item.page, item.image, item.thumbnail]
              : [item.url];
            if (required.some(value => !safe(value))) {
              throw new Error("Media result has an invalid required source URL");
            }
            const sourceUrl = new URL(kind === "images" ? item.page : item.url);
            hosts.add(sourceUrl.hostname);
            if (kind === "videos") {
              for (const key of ["thumbnailUrl", "embedUrl"]) {
                const value = item[key];
                if (!value) continue; // These fields are optional for some providers.
                if (!safe(value)) throw new Error("Video " + key + " is not a valid HTTP(S) URL");
                const optionalUrl = new URL(value);
                if (optionalUrl.hostname === sourceUrl.hostname &&
                    optionalUrl.pathname === "/" && !optionalUrl.search && !optionalUrl.hash) {
                  throw new Error("Video " + key + " incorrectly points to the source homepage");
                }
              }

              // Match the frontend's player policy: HTTPS canonical PeerTube
              // embeds may be same-origin or use one of the configured instances.
              if (item.embedUrl) {
                const player = new URL(item.embedUrl);
                const playerHost = player.hostname.toLowerCase().replace(/^www\./, "");
                const youtubeWatchHost = sourceUrl.hostname.toLowerCase().replace(/^www\./, "");
                const isYouTube = ["youtube.com", "m.youtube.com", "youtu.be"].includes(youtubeWatchHost);
                if (player.protocol !== "https:" || player.port || player.username || player.password) {
                  throw new Error("Video player URL must use HTTPS without credentials or a custom port");
                }

                if (isYouTube) {
                  const watchId = youtubeWatchHost === "youtu.be"
                    ? sourceUrl.pathname.split("/").filter(Boolean)[0]
                    : sourceUrl.pathname === "/watch"
                      ? sourceUrl.searchParams.get("v")
                      : sourceUrl.pathname.match(/^\/(?:shorts|live|embed)\/([\w-]+)/)?.[1];
                  const playerId = player.pathname.match(/^\/embed\/([\w-]+)\/?$/)?.[1];
                  if (!["youtube.com", "youtube-nocookie.com"].includes(playerHost) ||
                      !watchId || playerId !== watchId) {
                    throw new Error("YouTube player does not match its source video");
                  }
                } else {
                  const trustedPeerTubeHosts = new Set(["peertube.tv", "peer.tube", "spectra.video"]);
                  const canonicalPlayer = /^\/videos\/embed\/[A-Za-z0-9_-]+\/?$/.test(player.pathname);
                  const allowedOrigin = player.origin === sourceUrl.origin || trustedPeerTubeHosts.has(playerHost);
                  if (!canonicalPlayer || !allowedOrigin) {
                    throw new Error("PeerTube player is not on the source origin or a configured instance");
                  }
                }
              }
            }
          }
          console.log("Search route: " + kind + "; " + d.count +
            " results across " + hosts.size + " source hosts");
          NODE
            rm -f "$tmp"
          done

  legacy:
    name: Original web-search and news API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SEARCH_API: https://henry-search-api.henrymeraldcompany.workers.dev
    steps:
      - name: Check original web-search and news routes
        shell: bash
        run: |
          set -euo pipefail
          for route in search news; do
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --output "$tmp" --write-out '%{http_code}' --max-time 45 --get --data-urlencode "q=technology" "$SEARCH_API/$route")"
            if [[ "$status" != "200" ]]; then
              echo "Legacy route $route returned HTTP $status"
              node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{try{const d=JSON.parse(s);console.error(JSON.stringify({error:d.error||null,diagnostic:d.diagnostic||null}))}catch{console.error(s)}})' < "$tmp" || cat "$tmp"
              rm -f "$tmp"
              exit 1
            fi
            node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>{const d=JSON.parse(s);const route=process.argv[1];if(typeof d.query!=="string"||!Array.isArray(d.results))throw new Error("Legacy route response contract failed");for(const item of d.results){if(!item||typeof item.title!=="string"||!item.title.trim())throw new Error("Legacy result is missing a title");if(typeof item.url!=="string"||!/^https?:\/\//i.test(item.url))throw new Error("Legacy result has an invalid source URL")}console.log("Legacy route: "+route+"; "+d.results.length+" results; source "+(d.source||"unknown"))})' "$route" < "$tmp"
            rm -f "$tmp"
          done
  frontend:
    name: Published frontend playback controls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [media, legacy]
    if: always()
    env:
      PAGES_BASE: https://henrymeraldcompany-bit.github.io/henry-search
    steps:
      - name: Verify the published app.js matches this commit
        shell: bash
        run: |
          set -euo pipefail
          published="$(mktemp)"
          expected="$(mktemp)"
          trap 'rm -f "$published" "$expected"' EXIT

          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --output "$published" --write-out '%{http_code}' --max-time 12 --header 'Cache-Control: no-cache' "$PAGES_BASE/app.js?build=$GITHUB_SHA" || true)"
            if [[ "$status" == "200" ]]; then
              if curl --fail --silent --show-error --location --max-time 15 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/app.js" --output "$expected" &&
                 cmp -s "$published" "$expected"; then
                node - "$published" <<'NODE'
          const fs = require("node:fs");
          const source = fs.readFileSync(process.argv[2], "utf8");
          const declaration = source.match(/const PEERTUBE_EMBED_HOSTS = new Set\(\[([\s\S]*?)\]\);/);
          if (!declaration) throw new Error("Published app.js is missing the PeerTube embed allowlist");
          const hosts = Array.from(declaration[1].matchAll(/"([^"]+)"/g), match => match[1]).sort();
          const expected = ["peer.tube", "peertube.tv", "spectra.video"].sort();
          if (JSON.stringify(hosts) !== JSON.stringify(expected)) {
            throw new Error("Published PeerTube embed allowlist does not match the configured instances");
          }
          for (const marker of ["function stopActiveVideoPlayer", "function toggleActiveVideoPlayer", "Stop playback"]) {
            if (!source.includes(marker)) throw new Error("Published app.js is missing " + marker);
          }
          if (/YOUTUBE_API_KEY\s*=/.test(source)) throw new Error("A YouTube API key assignment must never appear in frontend code");
          console.log("Published app.js matches this commit and contains the trusted player policy and stop control.");
          NODE
                exit 0
              fi
            fi
            echo "Published frontend not updated yet (attempt $attempt/12, HTTP ${status:-request-error}); retrying."
            sleep 5
          done

          echo "The published app.js did not match the current commit after the retry window."
          echo "Last HTTP status: ${status:-request-error}"
          exit 1
      - name: Install Playwright and Chromium for browser checks
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install chromium
      - name: Verify in-page video player controls in Chromium
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: node backend/browser-playback-smoke.mjs
