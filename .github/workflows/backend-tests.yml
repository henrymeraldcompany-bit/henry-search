name: Backend regression tests

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Media Worker resource configuration without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config backend/wrangler.toml
      - name: Validate API Worker resource configuration without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config backend/search-api.wrangler.toml
      - name: Run all backend syntax and regression tests
        run: |
          for file in backend/*.js; do node --check "$file"; done
          node --test backend/*.test.mjs
