name: Backend regression tests

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run media regression tests
        run: node --check backend/worker.js && node --check backend/image-search.js && node --check backend/search-worker.js && node --test backend/duration.test.mjs backend/indexed-search.test.mjs backend/media-ranking.test.mjs backend/media-url.test.mjs backend/video-filters.test.mjs backend/image-providers.test.mjs backend/image-search-ranking.test.mjs backend/index-refresh.test.mjs backend/search-worker.test.mjs
